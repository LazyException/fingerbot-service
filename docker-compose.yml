version: "3.9"
services:
  ble-service:
    container_name: ble-service
    build: ./ble-service
    environment:
      FINGERBOT_MAC: ${FINGERBOT_MAC}
      SCAN_DURATION: ${SCAN_DURATION:-5}
    network_mode: host
    privileged: true
    restart: unless-stopped

  fingerbot-api:
    container_name: fingerbot-api
    build: .
    environment:
      FINGERBOT_MAC: ${FINGERBOT_MAC}
      SECRET_API_KEY: ${SECRET_API_KEY}
      PORT: 3000
      BLE_SERVICE_URL: http://localhost:4000
    network_mode: host
    depends_on:
      - ble-service
    restart: unless-stopped

  reverse-proxy:
    image: nginx:latest
    container_name: nginx-fingerbot
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    depends_on:
      - fingerbot-api
    restart: unless-stopped

  cloudflare:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - ./cloudflare:/etc/cloudflared
    network_mode: host
    restart: unless-stopped
