version: "3.9"

services:

  # -----------------------------
  # 🟦 BLE SERVICE (Python)
  # -----------------------------
  ble-service:
    container_name: ble-service
    build: ./ble-service
    environment:
      FINGERBOT_MAC: ${FINGERBOT_MAC}
      SCAN_DURATION: ${SCAN_DURATION:-5}
      PYTHONUNBUFFERED: 1
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
      - SYS_RAWIO
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    restart: unless-stopped

  # -----------------------------
  # 🟩 NODEJS FINGERBOT API
  # -----------------------------
  fingerbot-api:
    container_name: fingerbot-api
    build: .
    environment:
      FINGERBOT_MAC: ${FINGERBOT_MAC}
      SECRET_API_KEY: ${SECRET_API_KEY}
      PORT: 3000
      BLE_SERVICE_URL: http://localhost:4000
    network_mode: host
    depends_on:
      - ble-service
    restart: unless-stopped

  # -----------------------------
  # 🟧 NGINX REVERSE PROXY (local only)
  # -----------------------------
  reverse-proxy:
    image: nginx:latest
    container_name: nginx-fingerbot
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    depends_on:
      - fingerbot-api
    restart: unless-stopped

  # -----------------------------
  # 🟪 CLOUDFLARE TUNNEL
  # -----------------------------
  cloudflare:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - ./cloudflare:/etc/cloudflared
    network_mode: host
    restart: unless-stopped
