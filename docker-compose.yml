version: "3.9"
services:
  fingerbot-api:
    container_name: fingerbot-api
    build: .
    environment:
      FINGERBOT_MAC: ${FINGERBOT_MAC}
      SECRET_API_KEY: ${SECRET_API_KEY}
      PORT: 3000
    network_mode: host
    privileged: true
    restart: unless-stopped

  reverse-proxy:
    image: nginx:latest
    container_name: nginx-fingerbot
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    depends_on:
      - fingerbot-api
    restart: unless-stopped

  cloudflare:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - ./cloudflare:/etc/cloudflared
    network_mode: host
    restart: unless-stopped